<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center"> TaskList v2 </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <ion-item>
    <ion-input
      type="text"
      placeholder="Ingresa una nueva tarea..."
      name="task"
      [(ngModel)]="newTaskStr">
    </ion-input>
    <ion-button slot="end" (click)="addTask()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <ion-list>
    <ion-reorder-group [disabled]="false" (ionItemReorder)="actualizarPosiciones($event)">
      
      @for (task of tasks; track task.id) {
        <ion-item-sliding>
          
          <ion-item>
            <ion-label>{{ task.titulo }}</ion-label>
            <ion-reorder slot="end"></ion-reorder>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="confirmDelete($index)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>

        </ion-item-sliding>
      }

    </ion-reorder-group>
  </ion-list>

</ion-content>
